name: 'Setup shop'
description: 'Install the Shopware shop with plugin'
inputs:
  shopware-version:
    description: 'Version for the Shopware installation'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Create shop
      shell: bash
      run: shopware-cli project create shopware ${{ inputs.shopware-version }}

    - name: Fix Twig compatibility before installation
      shell: bash
      run: |
        cd shopware
        echo "=== Current versions ==="
        composer show twig/twig
        composer show squirrelphp/twig-php-syntax
        
        echo "=== Applying comprehensive compatibility patch ==="
        
        # Backup the original file
        cp vendor/squirrelphp/twig-php-syntax/src/TokenParser/ForeachTokenParser.php vendor/squirrelphp/twig-php-syntax/src/TokenParser/ForeachTokenParser.php.backup
        
        # Show the original problematic method
        echo "=== Original method ==="
        grep -A 10 -B 2 "parseAssignmentExpression" vendor/squirrelphp/twig-php-syntax/src/TokenParser/ForeachTokenParser.php
        
        # Use a very simple approach - just manually fix the two problematic lines
        FILE="vendor/squirrelphp/twig-php-syntax/src/TokenParser/ForeachTokenParser.php"
        
        # Step 1: Change private to protected
        sed -i 's/private function parseAssignmentExpression/protected function parseAssignmentExpression/' "$FILE"
        
        # Step 2: Create variables with the replacement strings to avoid escaping in sed
        RETURN_TYPE_NEW="Twig"
        NAMESPACE_SEPARATOR="Node"
        CLASS_NAME="Nodes"
        
        # Step 3: Build the replacement incrementally
        # First replace AssignNameExpression with a placeholder
        sed -i 's/: AssignNameExpression/: PLACEHOLDER_TYPE/' "$FILE"
        
        # Then replace the placeholder with the correct type
        sed -i "s/PLACEHOLDER_TYPE/\\\\${RETURN_TYPE_NEW}\\\\${NAMESPACE_SEPARATOR}\\\\${CLASS_NAME}/" "$FILE"
        
        # Step 4: Fix the return statement similarly
        # Replace the return line with a placeholder first
        sed -i 's/return new AssignNameExpression(/return PLACEHOLDER_RETURN/' "$FILE"
        
        # Then replace with the correct wrapped version
        sed -i "s/PLACEHOLDER_RETURN/new \\\\${RETURN_TYPE_NEW}\\\\${NAMESPACE_SEPARATOR}\\\\${CLASS_NAME}([new AssignNameExpression(/" "$FILE"
        
        # Add the closing bracket and parenthesis
        sed -i 's/getLine());/getLine())]);/' "$FILE"
        
        echo "=== After all changes ==="
        grep -A 10 "parseAssignmentExpression" "$FILE"
        
        # Verify PHP syntax is valid
        echo "=== Checking PHP syntax ==="
        php -l "$FILE"
        
        echo "=== Patch completed ==="
    - name: Install Shopware
      shell: bash
      run: |
        cp nosto-shopware6/.github/.env.local shopware/.env.local
        cp nosto-shopware6/.github/.env.local shopware/.env.test
        cd shopware
        ./bin/console system:install --basic-setup

    - name: Install plugin
      shell: bash
      run: |
        cp -r nosto-shopware6 shopware/custom/plugins
        cd shopware
        php bin/console plugin:refresh
        php bin/console plugin:install --activate --clearCache NostoIntegration
