name: 'Setup shop'
description: 'Install the Shopware shop with plugin'
inputs:
  shopware-version:
    description: 'Version for the Shopware installation'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Create shop
      shell: bash
      run: shopware-cli project create shopware ${{ inputs.shopware-version }}

    - name: Fix Twig compatibility before installation
      shell: bash
      run: |
        cd shopware
        echo "=== Current versions ==="
        composer show twig/twig
        composer show squirrelphp/twig-php-syntax
        
        echo "=== Examining the current file structure ==="
        
        # First, let's see what the current file looks like
        echo "=== Current file structure around parseAssignmentExpression ==="
        grep -n -A 20 -B 5 "parseAssignmentExpression" vendor/squirrelphp/twig-php-syntax/src/TokenParser/ForeachTokenParser.php || echo "Method not found with that exact name"
        
        # Let's check line 68 specifically (where the original error occurred)
        echo "=== Line 68 specifically ==="
        sed -n '68p' vendor/squirrelphp/twig-php-syntax/src/TokenParser/ForeachTokenParser.php
        
        # Let's see a broader context around line 68
        echo "=== Lines 60-80 ==="
        sed -n '60,80p' vendor/squirrelphp/twig-php-syntax/src/TokenParser/ForeachTokenParser.php
        
        # Look for any method that might be the problematic one
        echo "=== All function definitions in the file ==="
        grep -n "function " vendor/squirrelphp/twig-php-syntax/src/TokenParser/ForeachTokenParser.php
        
        # Look for AssignNameExpression usage
        echo "=== AssignNameExpression usage ==="
        grep -n "AssignNameExpression" vendor/squirrelphp/twig-php-syntax/src/TokenParser/ForeachTokenParser.php
        
        # Show file size and basic info
        echo "=== File info ==="
        wc -l vendor/squirrelphp/twig-php-syntax/src/TokenParser/ForeachTokenParser.php
        
        echo "=== Analysis complete - no changes made ==="
    - name: Install Shopware
      shell: bash
      run: |
        cp nosto-shopware6/.github/.env.local shopware/.env.local
        cp nosto-shopware6/.github/.env.local shopware/.env.test
        cd shopware
        ./bin/console system:install --basic-setup

    - name: Install plugin
      shell: bash
      run: |
        cp -r nosto-shopware6 shopware/custom/plugins
        cd shopware
        php bin/console plugin:refresh
        php bin/console plugin:install --activate --clearCache NostoIntegration
