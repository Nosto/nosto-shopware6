name: 'Setup shop'
description: 'Install the Shopware shop with plugin'
inputs:
  shopware-version:
    description: 'Version for the Shopware installation'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Create shop
      shell: bash
      run: shopware-cli project create shopware ${{ inputs.shopware-version }}

    - name: Fix Twig compatibility before installation
      shell: bash
      run: |
        cd shopware
        echo "=== Current versions ==="
        composer show twig/twig
        composer show squirrelphp/twig-php-syntax

        echo "=== Applying comprehensive compatibility patch ==="

        # Backup the original file
        cp vendor/squirrelphp/twig-php-syntax/src/TokenParser/ForeachTokenParser.php vendor/squirrelphp/twig-php-syntax/src/TokenParser/ForeachTokenParser.php.backup

        # Show the original problematic method
        echo "=== Original method ==="
        grep -A 5 -B 2 "parseAssignmentExpression" vendor/squirrelphp/twig-php-syntax/src/TokenParser/ForeachTokenParser.php

        # Use a simpler approach - just fix the specific method signature and return
        FILE="vendor/squirrelphp/twig-php-syntax/src/TokenParser/ForeachTokenParser.php"

        # Step 1: Change private to protected
        sed -i 's/private function parseAssignmentExpression/protected function parseAssignmentExpression/g' "$FILE"

        # Step 2: Show current state
        echo "=== After visibility change ==="
        grep -A 5 "parseAssignmentExpression" "$FILE"

        # Step 3: Replace the entire method content using a different approach
        # Find the line with the method and replace just that line
        LINE_NUM=$(grep -n "protected function parseAssignmentExpression" "$FILE" | cut -d ':' -f 1)
        if [ ! -z "$LINE_NUM" ]; then
          # Replace the method signature line
          sed -i "${LINE_NUM}s/.*/    protected function parseAssignmentExpression(Token \$token): \\\\Twig\\\\Node\\\\Nodes/" "$FILE"

          # Find and replace the return statement
          sed -i 's/return new AssignNameExpression(/return new \\Twig\\Node\\Nodes([new AssignNameExpression(/g' "$FILE"
          sed -i 's/\$token->getLine());/\$token->getLine())]);/g' "$FILE"
        fi

        # Verify the patch was applied
        echo "=== Verifying patch ==="
        grep -A 5 -B 2 "parseAssignmentExpression" "$FILE"

        echo "=== Patch applied successfully ==="
    - name: Install Shopware
      shell: bash
      run: |
        cp nosto-shopware6/.github/.env.local shopware/.env.local
        cp nosto-shopware6/.github/.env.local shopware/.env.test
        cd shopware
        ./bin/console system:install --basic-setup

    - name: Install plugin
      shell: bash
      run: |
        cp -r nosto-shopware6 shopware/custom/plugins
        cd shopware
        php bin/console plugin:refresh
        php bin/console plugin:install --activate --clearCache NostoIntegration
