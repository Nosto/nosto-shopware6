name: 'Setup shop'
description: 'Install the Shopware shop with plugin'
inputs:
  shopware-version:
    description: 'Version for the Shopware installation'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Create shop (allow failure)
      shell: bash
      run: shopware-cli project create shopware ${{ inputs.shopware-version }} || true

    - name: Clear Composer GitHub auth
      shell: bash
      run: |
        echo 'COMPOSER_AUTH={}' >> "$GITHUB_ENV"
        composer config -g --unset github-oauth.github.com || true
        composer config -g --unset --auth github-oauth.github.com || true

    - name: Configure Composer to bypass audit and update
      shell: bash
      run: |
        if [ -d "shopware" ]; then
          cd shopware
          echo "Composer version:"
          composer --version
          # Disable audit blocking by setting block-insecure to false
          jq '.config.audit."block-insecure" = false' composer.json > composer.json.tmp && mv composer.json.tmp composer.json
          composer update --no-interaction
        fi

    - name: Set minimum stability to dev
      shell: bash
      run: |
        cd shopware
        composer config minimum-stability dev

    - name: Install Shopware
      shell: bash
      run: |
        cp nosto-shopware6/.github/.env.local shopware/.env.local
        cp nosto-shopware6/.github/.env.local shopware/.env.test
        cd shopware
        ./bin/console system:install --basic-setup

    - name: Install plugin
      shell: bash
      run: |
        cp -r nosto-shopware6 shopware/custom/plugins
        cd shopware
        php bin/console plugin:refresh
        php bin/console plugin:install --activate --clearCache NostoIntegration
