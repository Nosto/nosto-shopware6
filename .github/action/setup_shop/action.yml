name: 'Setup shop'
description: 'Install the Shopware shop with plugin'
inputs:
  shopware-version:
    description: 'Version for the Shopware installation'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Create shop
      shell: bash
      run: shopware-cli project create shopware ${{ inputs.shopware-version }}

    - name: Fix Twig compatibility before installation
      shell: bash
      run: |
        cd shopware
        echo "=== Current versions ==="
        composer show twig/twig
        composer show squirrelphp/twig-php-syntax
        
        echo "=== Restoring backup and examining the actual method ==="
        
        # Restore from backup
        cp vendor/squirrelphp/twig-php-syntax/src/TokenParser/ForeachTokenParser.php.backup vendor/squirrelphp/twig-php-syntax/src/TokenParser/ForeachTokenParser.php
        
        # Find the actual parseAssignmentExpression method
        echo "=== Full parseAssignmentExpression method ==="
        grep -n -A 20 "private function parseAssignmentExpression" vendor/squirrelphp/twig-php-syntax/src/TokenParser/ForeachTokenParser.php
        
        # Let's see the file structure around line 68 where the error occurs
        echo "=== Lines around 68 (where the error occurs) ==="
        sed -n '60,80p' vendor/squirrelphp/twig-php-syntax/src/TokenParser/ForeachTokenParser.php
        
        # Check if this is the simple method we expect or a different one
        echo "=== Looking for the simple AssignNameExpression method ==="
        grep -n -A 5 -B 5 "AssignNameExpression" vendor/squirrelphp/twig-php-syntax/src/TokenParser/ForeachTokenParser.php
        
        # Check the exact line 68 mentioned in the original error
        echo "=== Line 68 specifically ==="
        sed -n '68p' vendor/squirrelphp/twig-php-syntax/src/TokenParser/ForeachTokenParser.php
        
        echo "=== Method signature analysis complete - no changes made yet ==="
    - name: Install Shopware
      shell: bash
      run: |
        cp nosto-shopware6/.github/.env.local shopware/.env.local
        cp nosto-shopware6/.github/.env.local shopware/.env.test
        cd shopware
        ./bin/console system:install --basic-setup

    - name: Install plugin
      shell: bash
      run: |
        cp -r nosto-shopware6 shopware/custom/plugins
        cd shopware
        php bin/console plugin:refresh
        php bin/console plugin:install --activate --clearCache NostoIntegration
