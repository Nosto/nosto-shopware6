name: 'Setup shop'
description: 'Install the Shopware shop with plugin'
inputs:
  shopware-version:
    description: 'Version for the Shopware installation'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Create shop (allow failure)
      shell: bash
      run: shopware-cli project create shopware ${{ inputs.shopware-version }} || true

    - name: Configure Composer audit ignore and update
      shell: bash
      run: |
        if [ -d "shopware" ]; then
          cd shopware
          # Add all known security advisories to ignore list using jq
          jq '.config.audit.ignore = [
            "PKSA-b824-t6kf-bqqz",
            "PKSA-6wp3-462p-vyty",
            "PKSA-gm36-p24v-vh6h",
            "PKSA-nh77-xw63-7449",
            "PKSA-gvcf-vf74-x7f6",
            "PKSA-5cdh-xb47-vj73",
            "PKSA-rcx3-vwg6-xf63"
          ]' composer.json > composer.json.tmp && mv composer.json.tmp composer.json
          composer update --no-interaction --no-audit
        fi

    - name: Set minimum stability to dev
      shell: bash
      run: |
        cd shopware
        composer config minimum-stability dev

    - name: Install Shopware
      shell: bash
      run: |
        cp nosto-shopware6/.github/.env.local shopware/.env.local
        cp nosto-shopware6/.github/.env.local shopware/.env.test
        cd shopware
        ./bin/console system:install --basic-setup

    - name: Install plugin
      shell: bash
      run: |
        cp -r nosto-shopware6 shopware/custom/plugins
        cd shopware
        php bin/console plugin:refresh
        php bin/console plugin:install --activate --clearCache NostoIntegration
