name: 'Setup shop'
description: 'Install the Shopware shop with plugin'
inputs:
  shopware-version:
    description: 'Version for the Shopware installation'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Create shop
      shell: bash
      run: shopware-cli project create shopware ${{ inputs.shopware-version }}

    - name: Fix Twig compatibility before installation
      shell: bash
      run: |
        cd shopware
        echo "=== Current versions ==="
        composer show twig/twig
        composer show squirrelphp/twig-php-syntax
        
        echo "=== Applying comprehensive compatibility patch ==="
        
        # Backup the original file
        cp vendor/squirrelphp/twig-php-syntax/src/TokenParser/ForeachTokenParser.php vendor/squirrelphp/twig-php-syntax/src/TokenParser/ForeachTokenParser.php.backup
        
        # Show the original problematic method
        echo "=== Original method ==="
        grep -A 10 -B 2 "parseAssignmentExpression" vendor/squirrelphp/twig-php-syntax/src/TokenParser/ForeachTokenParser.php
        
        # Create a patch file with the corrected method
        cat > /tmp/method_patch.txt << 'PATCH'
        protected function parseAssignmentExpression(Token $token): \Twig\Node\Nodes
        {
          if ($token->test('name')) {
          return new \Twig\Node\Nodes([new AssignNameExpression($token->getValue(), $token->getLine())]);
        }
          
          throw new SyntaxError(sprintf('Expected name for "foreach" assignment, got "%s".', $token->getValue()), $token->getLine(), $this->stream->getSourceContext());
        }
        PATCH

      # Find the line numbers for the method
      START_LINE=$(grep -n "private function parseAssignmentExpression" vendor/squirrelphp/twig-php-syntax/src/TokenParser/ForeachTokenParser.php | cut -d: -f1)
      END_LINE=$(tail -n +$START_LINE vendor/squirrelphp/twig-php-syntax/src/TokenParser/ForeachTokenParser.php | grep -n "^    }" | head -1 | cut -d: -f1)
        END_LINE=$((START_LINE + END_LINE - 1))
        
        echo "=== Replacing lines $START_LINE to $END_LINE ==="
        
        # Replace the method with the fixed version
        head -n $((START_LINE - 1)) vendor/squirrelphp/twig-php-syntax/src/TokenParser/ForeachTokenParser.php > /tmp/before.php
        cat /tmp/method_patch.txt >> /tmp/before.php
        tail -n +$((END_LINE + 1)) vendor/squirrelphp/twig-php-syntax/src/TokenParser/ForeachTokenParser.php >> /tmp/before.php
        
        # Replace the original file
        mv /tmp/before.php vendor/squirrelphp/twig-php-syntax/src/TokenParser/ForeachTokenParser.php
        
        # Verify the patch was applied
        echo "=== Verifying patch ==="
        grep -A 10 -B 2 "parseAssignmentExpression" vendor/squirrelphp/twig-php-syntax/src/TokenParser/ForeachTokenParser.php
        
        echo "=== Patch applied successfully ==="

    - name: Install Shopware
      shell: bash
      run: |
        cp nosto-shopware6/.github/.env.local shopware/.env.local
        cp nosto-shopware6/.github/.env.local shopware/.env.test
        cd shopware
        ./bin/console system:install --basic-setup

    - name: Install plugin
      shell: bash
      run: |
        cp -r nosto-shopware6 shopware/custom/plugins
        cd shopware
        php bin/console plugin:refresh
        php bin/console plugin:install --activate --clearCache NostoIntegration
