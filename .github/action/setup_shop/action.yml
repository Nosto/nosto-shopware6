name: 'Setup shop'
description: 'Install the Shopware shop with plugin'
inputs:
  shopware-version:
    description: 'Version for the Shopware installation'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Create shop
      shell: bash
      run: shopware-cli project create shopware ${{ inputs.shopware-version }}

    - name: Fix Twig compatibility before installation
      shell: bash
      run: |
        cd shopware
        echo "=== Investigating current state ==="
        composer show twig/twig || echo "twig/twig not found"
        composer show squirrelphp/twig-php-syntax || echo "squirrelphp/twig-php-syntax not found"
        
        echo "=== Checking what Shopware actually allows ==="
        composer why twig/twig
        composer why squirrelphp/twig-php-syntax
        
        # Try to find a working combination by allowing composer to resolve it
        # Use --ignore-platform-reqs to bypass some restrictions temporarily
        echo "=== Attempting to resolve dependencies ==="
        composer update --no-progress --no-interaction --ignore-platform-reqs twig/twig squirrelphp/twig-php-syntax || echo "Update failed, trying alternative approach"
        
        # If that fails, try forcing a specific known-good combination
        if ! composer show twig/twig > /dev/null 2>&1; then
        echo "=== Trying manual resolution ==="
        composer require --no-update twig/twig:3.4.3
        composer update --no-progress --no-interaction --ignore-platform-reqs
        fi
        
        echo "=== Final state ==="
        composer show twig/twig
        composer show squirrelphp/twig-php-syntax


    - name: Install Shopware
      shell: bash
      run: |
        cp nosto-shopware6/.github/.env.local shopware/.env.local
        cp nosto-shopware6/.github/.env.local shopware/.env.test
        cd shopware
        ./bin/console system:install --basic-setup

    - name: Install plugin
      shell: bash
      run: |
        cp -r nosto-shopware6 shopware/custom/plugins
        cd shopware
        php bin/console plugin:refresh
        php bin/console plugin:install --activate --clearCache NostoIntegration
