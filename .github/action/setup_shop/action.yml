name: 'Setup shop'
description: 'Install the Shopware shop with plugin'
inputs:
  shopware-version:
    description: 'Version for the Shopware installation'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Create shop
      shell: bash
      run: shopware-cli project create shopware ${{ inputs.shopware-version }}

    - name: Fix Twig compatibility before installation
      shell: bash
      run: |
        cd shopware
        echo "=== Current versions ==="
        composer show twig/twig
        composer show squirrelphp/twig-php-syntax
        
        echo "=== Applying targeted fix for method visibility ==="
        
        # Create a proper backup first
        cp vendor/squirrelphp/twig-php-syntax/src/TokenParser/ForeachTokenParser.php vendor/squirrelphp/twig-php-syntax/src/TokenParser/ForeachTokenParser.php.backup
        
        # Show the current problematic line
        echo "=== Current line 68 ==="
        sed -n '68p' vendor/squirrelphp/twig-php-syntax/src/TokenParser/ForeachTokenParser.php
        
        # Make the simple fix - change private to protected on line 68
        sed -i '68s/private function parseAssignmentExpression/protected function parseAssignmentExpression/' vendor/squirrelphp/twig-php-syntax/src/TokenParser/ForeachTokenParser.php
        
        # Verify the change
        echo "=== After fix - line 68 ==="
        sed -n '68p' vendor/squirrelphp/twig-php-syntax/src/TokenParser/ForeachTokenParser.php
        
        # Check PHP syntax
        echo "=== Checking PHP syntax ==="
        php -l vendor/squirrelphp/twig-php-syntax/src/TokenParser/ForeachTokenParser.php
        
        # Show the context around the fixed method
        echo "=== Method after fix ==="
        sed -n '65,75p' vendor/squirrelphp/twig-php-syntax/src/TokenParser/ForeachTokenParser.php
        
        echo "=== Fix applied successfully ==="

    - name: Install Shopware
      shell: bash
      run: |
        cp nosto-shopware6/.github/.env.local shopware/.env.local
        cp nosto-shopware6/.github/.env.local shopware/.env.test
        cd shopware
        ./bin/console system:install --basic-setup

    - name: Install plugin
      shell: bash
      run: |
        cp -r nosto-shopware6 shopware/custom/plugins
        cd shopware
        php bin/console plugin:refresh
        php bin/console plugin:install --activate --clearCache NostoIntegration
