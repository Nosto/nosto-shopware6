name: 'Setup runner'
description: 'Setup PHP and MySQL'
inputs:
  php-version:
    description: 'PHP version for PHP setup'
    required: true
    default: '8.2'

runs:
  using: 'composite'
  steps:
    - name: Setup PHP with Composer 2
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ inputs.php-version }}
        extensions: dom, gd, mbstring, pdo_mysql, zip
        coverage: xdebug
        tools: composer:v2

    - name: Start MySQL
      shell: bash
      run: |
        sudo systemctl start mysql
        mysql -uroot -proot -e 'CREATE DATABASE IF NOT EXISTS shopware_test;'

    - uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install shopware-cli
      uses: FriendsOfShopware/shopware-cli-action@v1
      with:
        # 0.19+ runs PHPStan/ESLint in "extension validate" by default and only supports
        # client-ID login for uploads, which breaks the release workflow. Keep 0.18.5 until migrated.
        version: v0.18.5
