name: 'Setup runner'
description: 'Setup PHP and MySQL'
inputs:
  php-version:
    description: 'PHP version for PHP setup'
    required: true
    default: '8.2'

runs:
  using: 'composite'
  steps:
    - name: Setup PHP with Composer 2
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ inputs.php-version }}
        extensions: dom, gd, mbstring, pdo_mysql, zip
        coverage: xdebug
        tools: composer:v2

    - name: Start MySQL service
      shell: bash
      run: |
        sudo /etc/init.d/mysql start
        mysql -uroot -e "ALTER USER 'root'@'localhost' IDENTIFIED WITH mysql_native_password BY 'root'; FLUSH PRIVILEGES;"
        mysql -uroot -proot -e "CREATE DATABASE IF NOT EXISTS shopware_test;"
        mysql -uroot -proot -e "CREATE USER IF NOT EXISTS 'shopware'@'localhost' IDENTIFIED BY 'shopware';"
        mysql -uroot -proot -e "GRANT ALL PRIVILEGES ON *.* TO 'shopware'@'localhost'; FLUSH PRIVILEGES;"

    - uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install shopware-cli
      uses: FriendsOfShopware/shopware-cli-action@v1
