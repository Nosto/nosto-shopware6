# Automatically uploads the pushed plugin version to the Shopware Store.

name: Shopware Store Release
on:
  push:
    tags:
      - '*'

env:
  PLUGIN_NAME: NostoIntegration
  PLUGIN_MIN_REQUIREMENT: ~6.7.0
  SHOPWARE_CLI_ACCOUNT_EMAIL: ${{ secrets.ACCOUNT_USER }}
  SHOPWARE_CLI_ACCOUNT_PASSWORD: ${{ secrets.ACCOUNT_PASSWORD }}
  SHOPWARE_CLI_COMPANY_ID: ${{ secrets.ACCOUNT_COMPANY_ID }}

jobs:
  validatePlugin:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: nosto-shopware6

      - name: Setup Runner
        uses: ./nosto-shopware6/.github/action/setup_runner

      - name: Setup Plugin
        uses: ./nosto-shopware6/.github/action/setup_plugin

      - name: Setup Shopware Shop
        uses: ./nosto-shopware6/.github/action/setup_shop
        with:
          shopware-version: '6.7.4.0'

      - name: Build admin + storefront assets
        run: |
          cd shopware
          ./bin/build-js.sh

      - name: Set minimum requirement
        working-directory: nosto-shopware6
        run: composer require shopware/core "${{ env.PLUGIN_MIN_REQUIREMENT }}" --no-update

      - name: Remove .gitignore files from vendor
        run: find nosto-shopware6/vendor -type f -name ".gitignore" -delete

      - name: Remove .gitignore files from plugin
        run: find nosto-shopware6 -type f -name ".gitignore" ! -path "./.gitignore" -delete

      - name: Remove node_modules from plugin
        run: rm -rf nosto-shopware6/node_modules

      - name: Clean up test files
        run: |
            # Delete folders named 'tests'
            find . -type d -name "tests" -exec rm -rf {} +

            # Delete common test files and config
            find . -type f \( -name "*Test.php" -o -name "TestCase.php" -o -name "phpunit.xml.dist" \) -delete

      - name: Prepare clean build directory
        run: |
            mkdir clean
            rsync -a nosto-shopware6/ clean/ \
            --exclude .git \
            --exclude .github \
            --exclude node_modules \
            --exclude tests \
            --exclude "*Test.php" \
            --exclude "TestCase.php" \
            --exclude "phpunit.xml.dist" \
            --exclude ".gitignore"

      - name: Validate plugin files
        working-directory: clean
        run: shopware-cli extension validate .

      - name: Build plugin release zip file
        working-directory: clean
        run: shopware-cli extension zip . --disable-git

      - name: Move release zip to original folder
        run: mv clean/NostoIntegration.zip ./nosto-shopware6/

      - name: Upload release zip file
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PLUGIN_NAME }}.zip
          path: ./nosto-shopware6/${{ env.PLUGIN_NAME }}.zip

  storeRelease:
    if: startsWith(github.ref, 'refs/tags/')
    needs: validatePlugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Runner
        uses: ./.github/action/setup_runner

      - name: Get version
        id: get_version
        run: echo ::set-output name=VERSION::${GITHUB_REF#refs/tags/}

      - name: Download release zip file
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.PLUGIN_NAME }}.zip
          path: ./

      - name: Upload plugin to Shopware Store
        run: shopware-cli account producer extension upload ./${{ env.PLUGIN_NAME }}.zip --verbose

      - name: Create GitHub release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          release_name: ${{ steps.get_version.outputs.VERSION }}
          body_path: 'docs/release/body.md'
          draft: false
          prerelease: false

      - name: Upload release asset
        id: upload_release_asset
        uses: actions/upload-release-asset@v1.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ github.workspace }}/${{ env.PLUGIN_NAME }}.zip
          asset_name: ${{ env.PLUGIN_NAME }}-${{ steps.get_version.outputs.VERSION }}.zip
          asset_content_type: application/zip
