name: Tests

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-versions: [ '8.1', '8.2' ]
        shopware-versions: [
          '6.5.4.1',
          '6.5.5.2',
          '6.5.6.1',
          '6.5.7.3',
        ]

    name: Shopware ${{ matrix.shopware-versions }} Test (PHP ${{ matrix.php-versions }})
    steps:
      - uses: actions/checkout@v4
        with:
          path: nosto-shopware6

      - name: Setup Runner
        uses: ./nosto-shopware6/.github/action/setup_runner
        with:
          php-version: ${{ matrix.php-versions }}

      - name: Setup Plugin
        uses: ./nosto-shopware6/.github/action/setup_plugin

      - name: Setup Shopware Shop
        uses: ./nosto-shopware6/.github/action/setup_shop
        with:
          shopware-version: ${{ matrix.shopware-versions }}

      - name: Fix Twig compatibility issue
        run: |
          cd shopware
          # Lock to compatible versions that work with older Shopware versions
          composer require --dev --no-update "twig/twig:^3.4.0"
          composer require --dev --no-update "squirrelphp/twig-php-syntax:^1.8"
          composer update --no-progress --no-interaction --with-dependencies twig/twig squirrelphp/twig-php-syntax

      - name: Install test dependencies for SW
        run: |
          cd shopware
          composer require --dev symfony/test-pack

      - name: Debug dependency versions (optional - remove after fixing)
        run: |
          cd shopware
          echo "=== Resolved versions ==="
          composer show twig/twig
          composer show squirrelphp/twig-php-syntax

      - name: Run PHPUnit test suite
        run: |
          cd shopware/custom/plugins/nosto-shopware6
          SYMFONY_DEPRECATIONS_HELPER=disabled composer test
